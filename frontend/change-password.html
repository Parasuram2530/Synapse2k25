<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password - StudyZone</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <!-- Navigation Header -->
    <nav class="main-nav">
        <div class="nav-container">
            <div class="nav-brand">
                <i class="fas fa-graduation-cap"></i>
                <span>Learning Management System</span>
            </div>
            <div class="nav-links">
                <a href="index.html" class="nav-link">Dashboard</a>
                <a href="#about" class="nav-link">About</a>
                <a href="#contact" class="nav-link">Contact</a>
            </div>
        </div>
    </nav>

    <!-- Change Password Section -->
    <section class="auth-section">
        <div class="auth-container">
            <div class="auth-header">
                <h2><i class="fas fa-key"></i> Change Password</h2>
                <p>Update your account password</p>
            </div>

            <div class="form-container active">
                <form id="changePasswordForm">
                    <div class="form-group">
                        <label for="currentPassword">
                            <i class="fas fa-lock"></i> Current Password
                        </label>
                        <input type="password" id="currentPassword" name="currentPassword" required placeholder="Enter your current password">
                    </div>
                    <div class="form-group">
                        <label for="newPassword">
                            <i class="fas fa-key"></i> New Password
                        </label>
                        <input type="password" id="newPassword" name="newPassword" required minlength="6" placeholder="Enter your new password">
                        <small class="password-hint">Password must be at least 6 characters long</small>
                    </div>
                    <div class="form-group">
                        <label for="confirmPassword">
                            <i class="fas fa-check-circle"></i> Confirm New Password
                        </label>
                        <input type="password" id="confirmPassword" name="confirmPassword" required minlength="6" placeholder="Confirm your new password">
                    </div>
                    <div class="password-strength">
                        <div class="strength-meter">
                            <div class="strength-bar" id="strengthBar"></div>
                        </div>
                        <span class="strength-text" id="strengthText">Password strength</span>
                    </div>
                    <button type="submit" class="btn-primary btn-full">
                        <i class="fas fa-save"></i> Change Password
                    </button>
                </form>
            </div>

            <div class="auth-footer">
                <p><a href="index.html"><i class="fas fa-arrow-left"></i> Back to Dashboard</a></p>
            </div>
        </div>
    </section>

    <script src="change-password.js"></script>
</body>
</html>
